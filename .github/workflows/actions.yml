name: Assignment Automation - Parallel BigQuery
on:
  workflow_dispatch:
  # Enable schedule only after manual validation; replace old workflow, do not duplicate it.
  # schedule:
  #   - cron: '30 3,6,9,12,15,18 * * *'
permissions:
  contents: read
concurrency:
  group: assignment-automation-pipeline
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python Assignment_Pipeline_Automation.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT_ID: masterclass-automation-503806
          BQ_DATASET: academic_analytics
          BQ_LOCATION: asia-south1
          ENABLE_BIGQUERY: 'true'
          ENABLE_SHEETS: 'true'
          PYTHONUNBUFFERED: '1'
