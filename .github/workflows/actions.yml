name: Assignment Automation - Sandbox Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assignment-automation-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload Assignment Data to BigQuery
        run: python Assignment_BigQuery_Test.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          BQ_PROJECT_ID: masterclass-automation-503806
          BQ_DATASET: academic_analytics
          BQ_LOCATION: asia-south1
          ENABLE_BIGQUERY: 'true'
          ENABLE_SHEETS: 'false'
          PYTHONUNBUFFERED: '1'
